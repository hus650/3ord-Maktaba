<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة أهل العلم | فهرس الكتب</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="library-header">
    <h1>مكتبة أهل العلم</h1>
    <p>تصفّح الكتب المتوفرة لدينا وتحقّق من توفّرها قبل زيارتك</p>
    <div class="search-filter-bar">
      <input type="text" id="searchInput" placeholder="بحث في العناوين أو المؤلفين...">
      <select id="levelFilter">
        <option value="all">كافة المستويات</option>
        <option value="beginner">مبتدئ</option>
        <option value="intermediate">متوسط</option>
        <option value="advanced">متقدم</option>
      </select>
      <select id="stockFilter">
        <option value="all">الكل</option>
        <option value="in">المتوفر فقط</option>
        <option value="out">النافد فقط</option>
      </select>
      <a href="favorites.html" class="btn-fav">المفضلة (<span id="favCount">0</span>)</a>
    </div>
  </header>

  <main class="container">
    <div id="booksGrid" class="books-grid"></div>
    <div class="more-wrap"><button id="moreBtn" class="btn ghost" hidden>عرض المزيد</button></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
