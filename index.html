<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة ألحلبيه | فهرس الكتب</title>
<meta name="description" content="فهرس مكتبة ألحلبيه تحقق من توفر الكتب قبل زيارتك">
<style>
:root{--bg:#121614;--surface:#1a211d;--surface2:#212a25;--gold:#c5a059;--text:#e2e8f0;--muted:#94a3b8;--line:#2d3732;--green:#4ade80;--red:#f87171}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Cairo',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);direction:rtl;-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:active{transform:scale(.97)}

/* ===== الرأس ===== */
.hero{background:radial-gradient(ellipse at top,#1f2a23 0%,var(--bg) 70%);border-bottom:1px solid var(--line);padding:38px 16px 26px;text-align:center}
.hero .mark{display:inline-block;width:54px;height:54px;line-height:54px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-size:1.6rem;margin-bottom:12px}
.hero h1{margin:0 0 6px;font-size:1.7rem;font-weight:700;color:#f8fafc;letter-spacing:.3px}
.hero p{margin:0 auto 22px;max-width:520px;font-size:.88rem;color:var(--muted);font-weight:300}
.bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:860px;margin:0 auto}
.bar input,.bar select{background:var(--surface);color:var(--text);border:1px solid var(--line);padding:11px 14px;border-radius:12px;font-size:.9rem;outline:none;transition:border-color .2s}
.bar input:focus,.bar select:focus{border-color:var(--gold)}
.bar input{flex:1 1 240px;min-width:200px}
.bar select{flex:0 1 auto;max-width:190px}
.fav-open{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:11px 16px;border-radius:12px;font-size:.88rem;font-weight:600;white-space:nowrap;transition:all .2s}
.fav-open:hover{background:var(--gold);color:var(--bg)}

/* ===== الإحصائيات ===== */
.stats{max-width:1200px;margin:18px auto 0;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.78rem;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip b{color:var(--text);margin-inline-start:4px}
.chip.in b{color:var(--green)}.chip.out b{color:var(--red)}
#resultCount{font-size:.8rem;color:var(--muted)}

/* ===== الشبكة والبطاقات ===== */
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;animation:up .4s cubic-bezier(.16,1,.3,1) both;transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(197,160,89,.45);transform:translateY(-2px)}
.card.is-out{opacity:.62}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.68rem;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.03);color:var(--muted);border:1px solid rgba(255,255,255,.05)}
.tag.in{background:rgba(37,211,102,.12);color:var(--green);border-color:rgba(37,211,102,.3)}
.tag.out{background:rgba(239,68,68,.12);color:var(--red);border-color:rgba(239,68,68,.3)}
.card h3{margin:0 0 4px;font-size:.96rem;font-weight:600;color:#f1f5f9;line-height:1.45}
.card .auth{margin:0;font-size:.76rem;color:var(--muted)}
.card .lvl{margin:6px 0 0;font-size:.7rem;color:var(--gold)}
.fbtn{width:100%;background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-size:.76rem;transition:all .2s}
.fbtn:hover{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.fbtn.on{background:rgba(197,160,89,.15);border-color:var(--gold);color:var(--gold)}
.skel{height:170px;border-radius:16px;background:var(--surface);border:1px solid var(--line);animation:pulse 1.2s infinite}
.msgbox{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px}
.msgbox .btn{margin-top:14px}
.btn{background:var(--gold);color:var(--bg);border:none;padding:10px 20px;border-radius:12px;font-weight:600;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.more{text-align:center;margin-top:26px}

/* ===== درج المفضلة ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);z-index:1000;display:flex;justify-content:flex-start;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.overlay.open{opacity:1;visibility:visible}
.drawer{width:100%;max-width:420px;height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.overlay.open .drawer{transform:none}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dhead h2{margin:0;font-size:1.05rem;color:#f8fafc}
.x{background:none;border:none;color:var(--muted);font-size:1.7rem;line-height:1}
.dlist{flex:1;overflow-y:auto;padding:16px 20px}
.ditem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ditem h4{margin:0 0 3px;font-size:.9rem}
.ditem p{margin:0;font-size:.74rem;color:var(--muted)}
.ditem .rm{background:none;border:none;color:var(--red);font-size:.8rem}
.dfoot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.dfoot .btn{flex:1}

/* ===== عناصر إضافية ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:10px 20px;border-radius:12px;font-size:.85rem;opacity:0;visibility:hidden;transition:all .3s;z-index:2000}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.top{position:fixed;bottom:24px;left:18px;width:44px;height:44px;border-radius:50%;background:var(--surface2);color:var(--gold);border:1px solid var(--gold);font-size:1.1rem;opacity:0;visibility:hidden;transition:all .3s;z-index:900}
.top.show{opacity:1;visibility:visible}
footer{text-align:center;padding:24px 16px 34px;color:var(--muted);font-size:.75rem;border-top:1px solid var(--line)}
@media(max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .hero{padding:30px 14px 22px}.hero h1{font-size:1.45rem}
  .bar select{flex:1 1 40%;max-width:none}
  .fav-open{flex:1 1 100%}
  .stats{justify-content:center}
}
</style>
</head>
<body>

<header class="hero">
  <div class="mark">☪</div>
  <h1>مكتبة ألحلبيه</h1>
  <p>تصفّح فهرس الكتب وتحقّق من توفّرها قبل زيارتك، وأضف ما يعجبك إلى المفضلة</p>
  <div class="bar">
    <input type="search" id="q" placeholder="ابحث بعنوان الكتاب أو المؤلف..." autocomplete="off">
    <select id="fLevel" aria-label="المستوى">
      <option value="all">كافة المستويات</option>
      <option value="beginner">مبتدئ</option>
      <option value="intermediate">متوسط</option>
      <option value="advanced">متقدم</option>
    </select>
    <select id="fSeries" aria-label="السلسلة"><option value="all">كل السلاسل</option></select>
    <select id="fStock" aria-label="التوفر">
      <option value="all">الكل</option>
      <option value="in">المتوفر فقط</option>
      <option value="out">النافد فقط</option>
    </select>
    <button class="fav-open" id="openFav">المفضلة (<span id="favCount">0</span>) ♥</button>
  </div>
</header>

<div class="stats">
  <div class="chips">
    <span class="chip">الكل<b id="sAll">0</b></span>
    <span class="chip in">متوفر<b id="sIn">0</b></span>
    <span class="chip out">نافد<b id="sOut">0</b></span>
  </div>
  <span id="resultCount"></span>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn ghost" id="more" hidden>عرض المزيد</button></div>
</main>

<footer>مكتبة أهل العلم · الفهرس للاطلاع على توفر الكتب فقط</footer>

<div class="overlay" id="overlay">
  <aside class="drawer" role="dialog" aria-label="المفضلة">
    <div class="dhead"><h2>كتبي المفضلة</h2><button class="x" id="closeFav" aria-label="إغلاق">&times;</button></div>
    <div class="dlist" id="dlist"></div>
    <div class="dfoot"><button class="btn danger" id="clearFav">مسح الكل</button><button class="btn" id="doneFav">تم</button></div>
  </aside>
</div>

<div class="toast" id="toast"></div>
<button class="top" id="top" aria-label="للأعلى">↑</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== إعدادات Firebase =====
firebase.initializeApp({
  apiKey: "AIzaSyBlON5-Q5zurGIGKTnqX6JuYUA1ZgH5_8A",
  authDomain: "ord-makaba.firebaseapp.com",
  projectId: "ord-makaba",
  storageBucket: "ord-makaba.firebasestorage.app",
  messagingSenderId: "435641213860",
  appId: "1:435641213860:web:636b9c0bbcaa72ef0cd731"
});
const db = firebase.firestore();

// ===== أدوات عامة =====
const $ = id => document.getElementById(id);
const LV = { beginner: 'مبتدئ', intermediate: 'متوسط', advanced: 'متقدم' };
const PER = 24, FAV_KEY = 'maktaba_favs';
let books = [], shown = PER;

function norm(s) {
  return (s || '').toString().toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim();
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ===== المفضلة (تُحفظ في جهاز الزائر) =====
function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { return []; } }
function setFavs(a) { try { localStorage.setItem(FAV_KEY, JSON.stringify(a)); } catch (e) {} }
function isFav(id) { return getFavs().includes(id); }
function toggleFav(id) {
  const f = getFavs(), i = f.indexOf(id);
  if (i >= 0) { f.splice(i, 1); toast('أُزيل من المفضلة'); } else { f.push(id); toast('أُضيف إلى المفضلة ♥'); }
  setFavs(f); $('favCount').textContent = f.length;
}

// ===== البطاقات =====
function makeCard(b, onChange) {
  const card = el('div', 'card' + (b.inStock ? '' : ' is-out'));
  const top = el('div'), tags = el('div', 'tags');
  tags.append(el('span', 'tag', b.series || 'مستقل'), el('span', 'tag ' + (b.inStock ? 'in' : 'out'), b.inStock ? 'متوفر' : 'نفذت الكمية'));
  top.append(tags, el('h3', '', b.title), el('p', 'auth', b.author || ''));
  if (LV[b.level]) top.append(el('p', 'lvl', 'المستوى: ' + LV[b.level]));
  const btn = el('button', 'fbtn');
  const paint = () => { const on = isFav(b.id); btn.textContent = on ? 'في المفضلة ♥' : 'إضافة للمفضلة ♡'; btn.classList.toggle('on', on); };
  btn.onclick = () => { toggleFav(b.id); paint(); if (onChange) onChange(); };
  paint(); card.append(top, btn);
  return card;
}

// ===== التصفية والعرض =====
function filtered() {
  const q = norm($('q').value), lv = $('fLevel').value, se = $('fSeries').value, st = $('fStock').value;
  return books.filter(b =>
    (!q || norm(b.title).includes(q) || norm(b.author).includes(q) || norm(b.series).includes(q)) &&
    (lv === 'all' || b.level === lv) && (se === 'all' || b.series === se) &&
    (st === 'all' || (st === 'in') === !!b.inStock));
}
function render() {
  const list = filtered(), grid = $('grid');
  grid.innerHTML = '';
  $('resultCount').textContent = list.length + ' نتيجة';
  if (!list.length) {
    const m = el('div', 'msgbox', books.length ? 'لم يتم العثور على كتب مطابقة لبحثك.' : 'لا توجد كتب في الفهرس حالياً.');
    grid.appendChild(m); $('more').hidden = true; return;
  }
  list.slice(0, shown).forEach(b => grid.appendChild(makeCard(b)));
  $('more').hidden = list.length <= shown;
}
function stats() {
  const inC = books.filter(b => b.inStock).length;
  $('sAll').textContent = books.length; $('sIn').textContent = inC; $('sOut').textContent = books.length - inC;
}
function fillSeries() {
  const sel = $('fSeries'), cur = sel.value;
  const names = [...new Set(books.map(b => b.series).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));
  sel.length = 1;
  names.forEach(n => { const o = el('option', '', n); o.value = n; sel.appendChild(o); });
  sel.value = names.includes(cur) ? cur : 'all';
}
function reset() { shown = PER; render(); }

// ===== درج المفضلة =====
function renderFav() {
  const ids = getFavs(), list = ids.map(id => books.find(b => b.id === id)).filter(Boolean);
  if (books.length && list.length !== ids.length) { setFavs(list.map(b => b.id)); $('favCount').textContent = list.length; }
  const box = $('dlist'); box.innerHTML = '';
  $('clearFav').hidden = !list.length;
  if (!list.length) { box.appendChild(el('div', 'msgbox', 'لا توجد كتب في المفضلة بعد.')); return; }
  list.sort((a, b) => (b.inStock ? 1 : 0) - (a.inStock ? 1 : 0)).forEach(b => {
    const row = el('div', 'ditem'), info = el('div');
    info.append(el('h4', '', b.title), el('p', '', (b.author || '') + ' · ' + (b.inStock ? 'متوفر' : 'نفذت الكمية')));
    const rm = el('button', 'rm', 'إزالة');
    rm.onclick = () => { toggleFav(b.id); renderFav(); render(); };
    row.append(info, rm); box.appendChild(row);
  });
}
function openFav() { renderFav(); $('overlay').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeFav() { $('overlay').classList.remove('open'); document.body.style.overflow = ''; }

// ===== الأحداث =====
let timer;
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(reset, 180); });
['fLevel', 'fSeries', 'fStock'].forEach(id => $(id).addEventListener('change', reset));
$('more').onclick = () => { shown += PER; render(); };
$('openFav').onclick = openFav;
$('closeFav').onclick = closeFav;
$('doneFav').onclick = closeFav;
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeFav(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFav(); });
$('clearFav').onclick = () => { if (confirm('هل تريد مسح كل المفضلة؟')) { setFavs([]); $('favCount').textContent = 0; renderFav(); render(); } };
$('top').onclick = () => window.scrollTo({ top: 0 });
window.addEventListener('scroll', () => $('top').classList.toggle('show', window.scrollY > 500));

// ===== تحميل الكتب =====
function showLoading() {
  const g = $('grid'); g.innerHTML = '';
  for (let i = 0; i < 8; i++) g.appendChild(el('div', 'skel'));
}
function load() {
  showLoading();
  db.doc('catalog/main').get().then(s => {
    books = s.exists ? (s.data().books || []) : [];
    stats(); fillSeries(); render();
  }).catch(() => {
    const g = $('grid'); g.innerHTML = '';
    const m = el('div', 'msgbox', 'تعذّر تحميل الكتب. تحقق من اتصالك بالإنترنت.');
    const b = el('button', 'btn', 'إعادة المحاولة'); b.onclick = load;
    m.appendChild(document.createElement('br')); m.appendChild(b); g.appendChild(m);
  });
}
$('favCount').textContent = getFavs().length;
load();
</script>
</body>
</html>
