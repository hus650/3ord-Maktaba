<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | مكتبة أهل العلم</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="library-header"><h1>لوحة التحكم</h1><p>إدارة الكتب والمخزون</p></header>
  <div class="panel">

    <div id="loginBox" class="card">
      <h2>تسجيل الدخول</h2>
      <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" dir="ltr"></div>
      <div class="field"><label>كلمة المرور</label><input id="password" type="password" dir="ltr"></div>
      <button id="loginBtn" class="btn">دخول</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <div id="app" hidden>
      <div class="tabs">
        <button class="btn" data-tab="listTab">قائمة الكتب</button>
        <button class="btn ghost" data-tab="addTab">إضافة كتاب جديد</button>
        <button class="btn ghost" data-tab="importTab">استيراد عدة كتب</button>
        <button class="btn danger" id="logoutBtn">خروج</button>
      </div>

      <section id="listTab" class="card">
        <div class="stats"><span id="sTotal"></span><span id="sIn"></span><span id="sOut"></span></div>
        <div class="tools">
          <input id="q" placeholder="بحث...">
          <select id="f"><option value="all">الكل</option><option value="in">المتوفر</option><option value="out">النافد</option></select>
        </div>
        <div id="rows"></div>
        <div class="pager"><button id="prev" class="btn ghost sm">السابق</button><span id="pg"></span><button id="next" class="btn ghost sm">التالي</button></div>
      </section>

      <section id="addTab" class="card" hidden>
        <h2 id="formTitle">إضافة كتاب جديد</h2>
        <div class="field"><label>عنوان الكتاب</label><input id="fTitle"></div>
        <div class="field"><label>المؤلف</label><input id="fAuthor"></div>
        <div class="field"><label>السلسلة (اتركه فارغاً إن لم يوجد)</label><input id="fSeries"></div>
        <div class="field"><label>المستوى</label>
          <select id="fLevel"><option value="beginner">مبتدئ</option><option value="intermediate">متوسط</option><option value="advanced">متقدم</option></select></div>
        <div class="field"><label>الحالة</label>
          <select id="fStock"><option value="1">متوفر</option><option value="0">نفذت الكمية</option></select></div>
        <button id="saveBook" class="btn">حفظ</button>
        <button id="cancelEdit" class="btn ghost" hidden>إلغاء التعديل</button>
        <div id="formMsg" class="msg"></div>
      </section>

      <section id="importTab" class="card" hidden>
        <h2>استيراد عدة كتب دفعة واحدة</h2>
        <p style="font-size:.85rem;color:var(--text-muted)">جهّز الكتب في Excel بأربعة أعمدة بهذا الترتيب: العنوان، المؤلف، السلسلة، المستوى (مبتدئ / متوسط / متقدم). حدّد الخلايا وانسخها (Ctrl+C) ثم الصقها هنا (Ctrl+V). الكتب الجديدة تُضاف كـ "متوفر".</p>
        <div class="field"><textarea id="importText" placeholder="الصق هنا..."></textarea></div>
        <button id="importBtn" class="btn">استيراد</button>
        <div id="importMsg" class="msg"></div>
      </section>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
