<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | مكتبة أهل العلم</title>
  <style>
:root {
  --bg-primary: #121614;
  --bg-surface: #1a211d;
  --accent-gold: #c5a059;
  --text-main: #e2e8f0;
  --text-muted: #94a3b8;
  --border-subtle: #2d3732;
}
* { box-sizing: border-box; }
body {
  font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-main);
  margin: 0; padding: 0; direction: rtl;
  -webkit-font-smoothing: antialiased;
}
a { text-decoration: none; }

/* ===== الرأس ===== */
.library-header {
  background: linear-gradient(180deg, #18201b 0%, var(--bg-primary) 100%);
  padding: 32px 16px 24px; border-bottom: 1px solid var(--border-subtle); text-align: center;
}
.library-header h1 { font-size: 1.5rem; font-weight: 600; color: #f8fafc; margin: 0 0 6px; }
.library-header p { font-size: .85rem; color: var(--text-muted); margin: 0 0 20px; font-weight: 300; }
.search-filter-bar {
  display: flex; gap: 10px; justify-content: center; align-items: center;
  flex-wrap: wrap; max-width: 700px; margin: 0 auto;
}
.search-filter-bar input, .search-filter-bar select {
  background-color: var(--bg-surface); color: var(--text-main);
  border: 1px solid var(--border-subtle); padding: 10px 14px; border-radius: 12px;
  font-size: .9rem; font-family: inherit; outline: none; transition: border-color .2s;
}
.search-filter-bar input:focus, .search-filter-bar select:focus { border-color: var(--accent-gold); }
.search-filter-bar input { flex: 1; min-width: 200px; }

/* ===== الأزرار ===== */
button { position: relative; overflow: hidden; cursor: pointer; font-family: inherit; }
button:active { transform: scale(.97); }
.btn-fav {
  display: inline-block; background: transparent; color: var(--accent-gold);
  border: 1px solid var(--accent-gold); font-weight: 500; font-size: .85rem;
  padding: 10px 16px; border-radius: 12px; transition: all .2s ease; white-space: nowrap;
}
.btn-fav:hover { background-color: var(--accent-gold); color: var(--bg-primary); }
.btn {
  background: var(--accent-gold); color: var(--bg-primary); border: none;
  padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: .9rem;
}
.btn.ghost { background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold); }
.btn.danger { background: transparent; color: #f87171; border: 1px solid #f87171; }
.btn.sm { padding: 6px 10px; font-size: .78rem; border-radius: 8px; }

/* ===== بطاقات الكتب ===== */
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
.books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.book-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px;
  padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
  animation: fadeInUp .4s cubic-bezier(.16, 1, .3, 1) forwards;
  transition: border-color .2s ease, transform .2s ease;
}
.book-card:hover { border-color: rgba(197, 160, 89, .4); transform: translateY(-2px); }
.book-card.is-out { opacity: .65; }
.book-badge {
  background-color: rgba(255, 255, 255, .03); color: var(--text-muted); font-size: .7rem;
  padding: 2px 8px; border-radius: 6px; display: inline-block; margin-bottom: 8px;
  border: 1px solid rgba(255, 255, 255, .04);
}
.badge-stock { display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 6px; margin-inline-start: 6px; }
.badge-stock.in { background: rgba(37, 211, 102, .12); color: #4ade80; border: 1px solid rgba(37, 211, 102, .3); }
.badge-stock.out { background: rgba(239, 68, 68, .12); color: #f87171; border: 1px solid rgba(239, 68, 68, .3); }
.book-card h3 { font-size: .95rem; font-weight: 600; margin: 0 0 4px; color: #f1f5f9; line-height: 1.4; }
.book-card p { color: var(--text-muted); font-size: .75rem; margin: 0 0 12px; }
.btn-add {
  background-color: rgba(255, 255, 255, .05); color: var(--text-main);
  border: 1px solid var(--border-subtle); padding: 8px 12px; border-radius: 10px;
  font-size: .75rem; width: 100%; transition: background .2s, color .2s, border-color .2s;
}
.btn-add:hover { background-color: var(--accent-gold); color: var(--bg-primary); border-color: var(--accent-gold); }
.btn-add.active { background-color: rgba(197, 160, 89, .15); border-color: var(--accent-gold); color: var(--accent-gold); }
.more-wrap { text-align: center; margin: 24px 0; }
.empty-msg { grid-column: 1 / -1; text-align: center; color: var(--text-muted); margin-top: 30px; }
.page-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.page-tools span { color: var(--text-muted); font-size: .9rem; }

/* ===== لوحة التحكم ===== */
.panel { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
.card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
.card h2 { margin: 0 0 12px; font-size: 1.05rem; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: .8rem; color: var(--text-muted); }
.field input, .field select, .field textarea, .tools input, .tools select {
  background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border-subtle);
  padding: 10px 12px; border-radius: 10px; font-family: inherit; font-size: .9rem; outline: none;
}
.field textarea { min-height: 160px; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs .btn { flex: 1; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.tools input { flex: 1; min-width: 160px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
.row .info { flex: 1; min-width: 180px; }
.row .info b { display: block; font-size: .92rem; }
.row .info span { font-size: .75rem; color: var(--text-muted); }
.row .acts { display: flex; gap: 6px; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; font-size: .85rem; color: var(--text-muted); }
.msg { font-size: .85rem; margin-top: 8px; color: var(--accent-gold); }
.pager { display: flex; justify-content: center; gap: 10px; margin-top: 14px; align-items: center; }

@media (max-width: 480px) {
  .books-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}

</style>
</head>
<body>
  <header class="library-header"><h1>لوحة التحكم</h1><p>إدارة الكتب والمخزون</p></header>
  <div class="panel">

    <div id="loginBox" class="card">
      <h2>تسجيل الدخول</h2>
      <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" dir="ltr"></div>
      <div class="field"><label>كلمة المرور</label><input id="password" type="password" dir="ltr"></div>
      <button id="loginBtn" class="btn">دخول</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <div id="app" hidden>
      <div class="tabs">
        <button class="btn" data-tab="listTab">قائمة الكتب</button>
        <button class="btn ghost" data-tab="addTab">إضافة كتاب جديد</button>
        <button class="btn ghost" data-tab="importTab">استيراد عدة كتب</button>
        <button class="btn danger" id="logoutBtn">خروج</button>
      </div>

      <section id="listTab" class="card">
        <div class="stats"><span id="sTotal"></span><span id="sIn"></span><span id="sOut"></span></div>
        <div class="tools">
          <input id="q" placeholder="بحث...">
          <select id="f"><option value="all">الكل</option><option value="in">المتوفر</option><option value="out">النافد</option></select>
        </div>
        <div id="rows"></div>
        <div class="pager"><button id="prev" class="btn ghost sm">السابق</button><span id="pg"></span><button id="next" class="btn ghost sm">التالي</button></div>
      </section>

      <section id="addTab" class="card" hidden>
        <h2 id="formTitle">إضافة كتاب جديد</h2>
        <div class="field"><label>عنوان الكتاب</label><input id="fTitle"></div>
        <div class="field"><label>المؤلف</label><input id="fAuthor"></div>
        <div class="field"><label>السلسلة (اتركه فارغاً إن لم يوجد)</label><input id="fSeries"></div>
        <div class="field"><label>المستوى</label>
          <select id="fLevel"><option value="beginner">مبتدئ</option><option value="intermediate">متوسط</option><option value="advanced">متقدم</option></select></div>
        <div class="field"><label>الحالة</label>
          <select id="fStock"><option value="1">متوفر</option><option value="0">نفذت الكمية</option></select></div>
        <button id="saveBook" class="btn">حفظ</button>
        <button id="cancelEdit" class="btn ghost" hidden>إلغاء التعديل</button>
        <div id="formMsg" class="msg"></div>
      </section>

      <section id="importTab" class="card" hidden>
        <h2>استيراد عدة كتب دفعة واحدة</h2>
        <p style="font-size:.85rem;color:var(--text-muted)">جهّز الكتب في Excel بأربعة أعمدة بهذا الترتيب: العنوان، المؤلف، السلسلة، المستوى (مبتدئ / متوسط / متقدم). حدّد الخلايا وانسخها (Ctrl+C) ثم الصقها هنا (Ctrl+V). الكتب الجديدة تُضاف كـ "متوفر".</p>
        <div class="field"><textarea id="importText" placeholder="الصق هنا..."></textarea></div>
        <button id="importBtn" class="btn">استيراد</button>
        <div id="importMsg" class="msg"></div>
      </section>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
const firebaseConfig = {
  apiKey: "AIzaSyBlON5-Q5zurGIGKTnqX6JuYUA1ZgH5_8A",
  authDomain: "ord-makaba.firebaseapp.com",
  projectId: "ord-makaba",
  storageBucket: "ord-makaba.firebasestorage.app",
  messagingSenderId: "435641213860",
  appId: "1:435641213860:web:636b9c0bbcaa72ef0cd731"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// البحث: يتجاهل التشكيل والفرق بين أ/إ/آ/ا وغيرها
function norm(s) {
  return (s || '').toString().toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ===== المفضلة (تُحفظ في جهاز الزائر) =====
const FAV_KEY = 'maktaba_favs';
function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { return []; }
}
function setFavs(arr) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); } catch (e) {}
}
function isFav(id) { return getFavs().includes(id); }
function toggleFav(id) {
  const f = getFavs(), i = f.indexOf(id);
  if (i >= 0) f.splice(i, 1); else f.push(id);
  setFavs(f);
  updateFavCount();
}
function updateFavCount() {
  const s = document.getElementById('favCount');
  if (s) s.textContent = getFavs().length;
}

// بطاقة كتاب
function makeCard(b, onChange) {
  const card = el('div', 'book-card' + (b.inStock ? '' : ' is-out'));
  const top = el('div');
  top.append(
    el('span', 'book-badge', b.series || 'مستقل'),
    el('span', 'badge-stock ' + (b.inStock ? 'in' : 'out'), b.inStock ? 'متوفر' : 'نفذت الكمية'),
    el('h3', '', b.title),
    el('p', '', b.author || '')
  );
  const btn = el('button', 'btn-add');
  const paint = () => {
    const on = isFav(b.id);
    btn.textContent = on ? 'في المفضلة ♥' : 'إضافة للمفضلة ♡';
    btn.classList.toggle('active', on);
  };
  btn.onclick = () => { toggleFav(b.id); paint(); if (onChange) onChange(); };
  paint();
  card.append(top, btn);
  return card;
}

const ref = db.doc('catalog/main');
const PER = 50, LVR = { 'مبتدئ': 'beginner', 'متوسط': 'intermediate', 'متقدم': 'advanced' };
let books = [], page = 1, editId = null;
const $ = id => document.getElementById(id);

auth.onAuthStateChanged(u => { $('loginBox').hidden = !!u; $('app').hidden = !u; if (u) load(); });
$('loginBtn').onclick = () => auth.signInWithEmailAndPassword($('email').value.trim(), $('password').value)
  .catch(() => $('loginMsg').textContent = 'البريد أو كلمة المرور غير صحيحة');
$('logoutBtn').onclick = () => auth.signOut();

document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  ['listTab', 'addTab', 'importTab'].forEach(t => $(t).hidden = t !== b.dataset.tab);
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('ghost', x !== b));
});

async function load() { const s = await ref.get(); books = s.exists ? (s.data().books || []) : []; render(); }
async function save(msgEl) {
  try { await ref.set({ books }); return true; }
  catch (e) { (msgEl || $('formMsg')).textContent = 'فشل الحفظ، تأكد من اتصالك بالإنترنت وصلاحيات الدخول'; return false; }
}

function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function render() {
  const q = norm($('q').value), f = $('f').value;
  const list = books.filter(b => (!q || norm(b.title).includes(q) || norm(b.author).includes(q)) && (f === 'all' || (f === 'in') === !!b.inStock));
  const inC = books.filter(b => b.inStock).length;
  $('sTotal').textContent = 'الإجمالي: ' + books.length;
  $('sIn').textContent = 'متوفر: ' + inC;
  $('sOut').textContent = 'نافد: ' + (books.length - inC);
  const pages = Math.max(1, Math.ceil(list.length / PER));
  if (page > pages) page = pages;
  $('pg').textContent = page + ' / ' + pages;
  const rows = $('rows'); rows.innerHTML = '';
  list.slice((page - 1) * PER, page * PER).forEach(b => {
    const r = mk('div', 'row'), info = mk('div', 'info'), acts = mk('div', 'acts');
    info.append(mk('b', '', b.title), mk('span', '', (b.author || '') + ' · ' + (b.series || 'مستقل')));
    const st = mk('button', 'btn sm ' + (b.inStock ? '' : 'ghost'), b.inStock ? 'متوفر ✓' : 'نفذت الكمية');
    st.onclick = async () => { b.inStock = !b.inStock; render(); await save(); };
    const ed = mk('button', 'btn ghost sm', 'تعديل'); ed.onclick = () => startEdit(b);
    const del = mk('button', 'btn danger sm', 'حذف');
    del.onclick = async () => { if (confirm('حذف "' + b.title + '" نهائياً؟')) { books = books.filter(x => x.id !== b.id); render(); await save(); } };
    acts.append(st, ed, del); r.append(info, acts); rows.appendChild(r);
  });
}
$('q').oninput = () => { page = 1; render(); };
$('f').onchange = () => { page = 1; render(); };
$('prev').onclick = () => { if (page > 1) { page--; render(); } };
$('next').onclick = () => { page++; render(); };

function startEdit(b) {
  editId = b.id; $('formTitle').textContent = 'تعديل الكتاب';
  $('fTitle').value = b.title; $('fAuthor').value = b.author || ''; $('fSeries').value = b.series === 'مستقل' ? '' : (b.series || '');
  $('fLevel').value = b.level; $('fStock').value = b.inStock ? '1' : '0'; $('cancelEdit').hidden = false;
  document.querySelector('[data-tab="addTab"]').click(); window.scrollTo(0, 0);
}
function resetForm() {
  editId = null; $('formTitle').textContent = 'إضافة كتاب جديد';
  ['fTitle', 'fAuthor', 'fSeries'].forEach(i => $(i).value = ''); $('fStock').value = '1'; $('cancelEdit').hidden = true;
}
$('cancelEdit').onclick = resetForm;
$('saveBook').onclick = async () => {
  const title = $('fTitle').value.trim();
  if (!title) { $('formMsg').textContent = 'الرجاء كتابة عنوان الكتاب'; return; }
  const data = { title, author: $('fAuthor').value.trim(), series: $('fSeries').value.trim() || 'مستقل', level: $('fLevel').value, inStock: $('fStock').value === '1' };
  if (editId) Object.assign(books.find(b => b.id === editId), data);
  else books.unshift({ id: Date.now(), ...data });
  if (await save()) { $('formMsg').textContent = 'تم الحفظ ✓'; resetForm(); render(); }
};

$('importBtn').onclick = async () => {
  const lines = $('importText').value.split('\n').map(l => l.trim()).filter(Boolean);
  const seen = new Set(books.map(b => norm(b.title) + '|' + norm(b.author)));
  let added = 0, skipped = 0, t = Date.now();
  lines.forEach(line => {
    const c = line.split(line.includes('\t') ? '\t' : ',').map(x => x.trim());
    if (!c[0] || c[0] === 'العنوان') return;
    const key = norm(c[0]) + '|' + norm(c[1]);
    if (seen.has(key)) { skipped++; return; }
    seen.add(key);
    books.push({ id: t++, title: c[0], author: c[1] || '', series: c[2] || 'مستقل', level: LVR[c[3]] || 'beginner', inStock: true });
    added++;
  });
  if (!added) { $('importMsg').textContent = 'لم تتم إضافة أي كتاب (المكرر: ' + skipped + ')'; return; }
  if (await save($('importMsg'))) { $('importMsg').textContent = 'تمت إضافة ' + added + ' كتاب، وتم تجاهل ' + skipped + ' مكرر ✓'; $('importText').value = ''; render(); }
};

</script>
</body>
</html>
